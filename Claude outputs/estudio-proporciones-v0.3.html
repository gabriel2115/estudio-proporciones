<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio de proporciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ==========================================================
   CSS: la apariencia de la página.
   Concepto: una lámina de package drawing. Perfil y frente
   comparten escala y línea de suelo, como en un plano técnico.
   Los colores son "variables": se definen una vez y se reutilizan.
   ========================================================== */
:root {
  --papel: #e9ecea;
  --plano: #f6f7f5;
  --tinta: #171c1e;
  --tinta-suave: #4f5a5e;
  --linea: #c6cdcb;
  --carroceria: #c9d0d1;
  --neumatico: #23292b;
  --llanta: #9fa9ac;
  --medida: #b3470e;
  --sobre-medida: #ffffff;
  --titulo: "Barlow Condensed", "Arial Narrow", sans-serif;
  --texto: "IBM Plex Sans", system-ui, sans-serif;
  --numero: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #12171a; --plano: #1a2124; --tinta: #e8eceb; --tinta-suave: #a3afb2;
    --linea: #364145; --carroceria: #4a5659; --neumatico: #0a0d0e; --llanta: #7c888b;
    --medida: #f08a4b; --sobre-medida: #1a1208; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #12171a; --plano: #1a2124; --tinta: #e8eceb; --tinta-suave: #a3afb2;
  --linea: #364145; --carroceria: #4a5659; --neumatico: #0a0d0e; --llanta: #7c888b;
  --medida: #f08a4b; --sobre-medida: #1a1208; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--papel);
  color: var(--tinta);
  font: 400 15px/1.45 var(--texto);
}
.lamina {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Encabezado */
.cabecera {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 12px 24px;
}
h1 {
  margin: 0;
  font: 600 clamp(30px, 4vw, 42px)/1 var(--titulo);
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.version { font: 400 13px var(--numero); color: var(--tinta-suave); margin: 4px 0 0; }
.tipologias { display: flex; flex-wrap: wrap; gap: 6px; }
.tipologias button {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--linea);
  border-radius: 4px;
  background: var(--plano);
  color: var(--tinta);
  font: 500 14px var(--texto);
  cursor: pointer;
}
.tipologias button[aria-pressed="true"] {
  background: var(--tinta);
  border-color: var(--tinta);
  color: var(--plano);
}
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--medida);
  outline-offset: 2px;
}

/* Distribución: lámina a la izquierda, controles a la derecha */
.estudio { display: flex; flex-direction: column; gap: 16px; }
.columna { display: contents; }
.vistas { display: contents; }

.vista {
  background: var(--plano);
  border: 1px solid var(--linea);
  border-radius: 4px;
  min-width: 0;
  margin: 0;
}
.vista figcaption {
  padding: 8px 12px 0;
  font: 600 14px var(--titulo);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tinta-suave);
}
.vista svg { display: block; width: 100%; height: auto; }
.perfil {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
}

/* Resumen de medidas */
.medidas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1px;
  background: var(--linea);
  border: 1px solid var(--linea);
  border-radius: 4px;
  overflow: hidden;
}
.medida { background: var(--plano); padding: 10px 12px; min-width: 0; }
.medida span { display: block; font-size: 13px; color: var(--tinta-suave); }
.medida strong {
  display: block;
  font: 500 20px var(--numero);
  font-variant-numeric: tabular-nums;
}

.nota { margin: 0; font-size: 14px; color: var(--tinta-suave); max-width: 72ch; }
.nota b { color: var(--tinta); font-weight: 600; }

/* Panel de controles */
.panel {
  background: var(--plano);
  border: 1px solid var(--linea);
  border-radius: 4px;
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.panel h2 {
  margin: 4px 0 0;
  font: 600 19px/1.1 var(--titulo);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.panel h2:first-child { margin-top: 0; }
.control { display: flex; flex-direction: column; gap: 2px; }
.control .fila {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.control label { font-weight: 500; }
.control output {
  font: 500 14px var(--numero);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.control small { color: var(--tinta-suave); font: 400 12.5px var(--numero); }
input[type="range"] {
  width: 100%;
  height: 28px;
  margin: 0;
  accent-color: var(--medida);
}
.interruptor {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  cursor: pointer;
}
.interruptor input { width: 18px; height: 18px; accent-color: var(--medida); }
.volver {
  min-height: 44px;
  border: 1px solid var(--linea);
  border-radius: 4px;
  background: transparent;
  color: var(--tinta);
  font: 500 14px var(--texto);
  cursor: pointer;
}

/* Botón Compilar y resultado */
.compilar {
  min-height: 48px;
  border: 0;
  border-radius: 4px;
  background: var(--medida);
  color: var(--sobre-medida);
  font: 600 20px var(--titulo);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.resultado {
  background: var(--plano);
  border: 1px solid var(--linea);
  border-radius: 4px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.resultado-cabecera {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
.resultado h2 { margin: 0; font: 600 24px/1.1 var(--titulo); letter-spacing: 0.02em; }
.resultado p { margin: 2px 0 0; font-size: 14px; color: var(--tinta-suave); }
.resultado .aviso { color: var(--medida); font-weight: 600; }
.descargar {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--tinta);
  border-radius: 4px;
  background: transparent;
  color: var(--tinta);
  font: 500 14px var(--texto);
  cursor: pointer;
}
.resultado-vistas { display: grid; grid-template-columns: minmax(0, 840fr) minmax(0, 360fr); gap: 12px; align-items: start; }
.resultado figure { margin: 0; min-width: 0; }
.resultado figcaption {
  margin-bottom: 4px;
  font: 600 14px var(--titulo);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tinta-suave);
}
.resultado-vistas svg { display: block; width: 100%; height: auto; border: 1px solid var(--linea); }
#visor-3d {
  height: clamp(300px, 46vw, 520px);
  border: 1px solid var(--linea);
  cursor: grab;
  touch-action: none;
}
#visor-3d:active { cursor: grabbing; }

/* Cubo de vistas */
.visor-marco { position: relative; }
.cubo-escena { position: absolute; top: 24px; right: 24px; width: 96px; height: 96px; perspective: 900px; }
.cubo {
  position: relative;
  width: 96px;
  height: 96px;
  transform-style: preserve-3d;
}
.cara {
  position: absolute;
  inset: 0;
  display: grid;
  box-sizing: border-box;
  grid-template-columns: 26px 1fr 26px;
  grid-template-rows: 26px 1fr 26px;
  background: var(--plano);
  box-shadow: inset 0 0 0 1px var(--tinta-suave);
}
.cara button {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.cara button.activa { background: var(--medida); outline: none; }
.cara-nombre {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--tinta);
  font: 600 12px var(--titulo);
  letter-spacing: 0.03em;
  pointer-events: none;
}
.cara:has(button:nth-child(5).activa) .cara-nombre { color: var(--sobre-medida); }
.vista-inicio {
  position: absolute;
  right: 10px;
  bottom: 10px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--linea);
  border-radius: 4px;
  background: var(--plano);
  color: var(--tinta);
  font: 500 13px var(--texto);
  cursor: pointer;
}
#visor-3d canvas { display: block; width: 100%; height: 100%; }
.sin-3d { padding: 16px; color: var(--tinta-suave); }

/* Dibujo */
.suelo { stroke: var(--tinta-suave); stroke-width: 1.5; }
.cuerpo { fill: var(--carroceria); stroke: var(--tinta); stroke-width: 2; stroke-linejoin: round; }
.goma { fill: var(--neumatico); stroke: var(--tinta-suave); stroke-width: 1; }
.llanta { fill: var(--llanta); }
.guia { fill: none; stroke: var(--medida); stroke-width: 1.5; stroke-dasharray: 5 5; }
.cota { stroke: var(--tinta-suave); stroke-width: 1.2; fill: none; }
.valor { fill: var(--tinta); font: 500 15px var(--numero); text-anchor: middle; }
.rotulo { fill: var(--tinta-suave); font: 400 13px var(--texto); text-anchor: middle; }
.ruedas-texto { fill: var(--medida); font: 500 15px var(--numero); text-anchor: middle; }

/* Pantallas angostas: textos más grandes en el perfil y frente más contenido */
@media (max-width: 979px) {
  .perfil .valor, .perfil .ruedas-texto { font-size: 28px; }
  .perfil .rotulo { display: none; }
  .frente svg { max-width: 260px; margin: 0 auto; }
  .panel { order: 1; }
  .cubo-escena { top: 18px; right: 14px; transform: scale(0.72); transform-origin: top right; }
  .resultado { order: 2; scroll-margin-top: 215px; }
  .resultado-vistas { grid-template-columns: minmax(0, 1fr); }
  .resultado-vistas figure:last-child svg { max-width: 260px; }
}

/* Pantallas anchas: dos columnas */
@media (min-width: 980px) {
  .estudio { display: grid; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  .columna { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .vistas { display: flex; gap: 16px; align-items: stretch; }
  /* El ancho de cada vista es proporcional a su dibujo: así comparten escala */
  .perfil { position: static; flex: 840 1 0; min-width: 0; }
  .frente { flex: 360 1 0; }
}
</style>

</head>
<body>
<main class="lamina">
  <header class="cabecera">
    <div>
      <h1>Estudio de proporciones</h1>
      <p class="version">v0.3 · todo se mide en ruedas</p>
    </div>
    <nav class="tipologias" id="tipologias" aria-label="Tipología de vehículo"></nav>
  </header>

  <div class="estudio">
    <div class="columna">
      <div class="vistas">
        <figure class="vista perfil">
          <figcaption>Perfil</figcaption>
          <svg id="dibujo-perfil" viewBox="0 0 840 420" role="img" aria-label="Vista lateral del auto con sus medidas en ruedas"></svg>
        </figure>
        <figure class="vista frente">
          <figcaption>Frente</figcaption>
          <svg id="dibujo-frente" viewBox="0 0 360 420" role="img" aria-label="Vista frontal del auto con su ancho y altura en ruedas"></svg>
        </figure>
      </div>
      <section class="medidas" id="medidas" aria-label="Resumen de medidas"></section>
      <p class="nota" id="nota"></p>

      <section class="resultado" id="resultado" aria-labelledby="titulo-resultado" hidden>
        <div class="resultado-cabecera">
          <div>
            <h2 id="titulo-resultado">Auto compilado</h2>
            <p id="estado-compilado"></p>
          </div>
          <button type="button" class="descargar" id="descargar-obj">Descargar OBJ</button>
        </div>
        <figure>
          <figcaption>Modelo 3D · usa el cubo o arrastra para girar</figcaption>
          <div class="visor-marco">
            <div id="visor-3d"></div>
            <div class="cubo-vistas" id="cubo-vistas" role="group" aria-label="Cubo de vistas">
              <div class="cubo-escena"><div class="cubo" id="cubo"></div></div>
              <button type="button" class="vista-inicio" id="vista-inicio">Vista inicial</button>
            </div>
          </div>
        </figure>
        <div class="resultado-vistas">
          <figure>
            <figcaption>Vista lateral</figcaption>
            <svg id="vista-lateral" viewBox="0 0 840 420" role="img" aria-label="Vista lateral compilada"></svg>
          </figure>
          <figure>
            <figcaption>Vista frontal</figcaption>
            <svg id="vista-frontal" viewBox="0 0 360 420" role="img" aria-label="Vista frontal compilada"></svg>
          </figure>
        </div>
      </section>
    </div>

    <aside class="panel">
      <h2>Rueda</h2>
      <div id="controles-rueda" style="display:contents"></div>
      <h2>Proporciones</h2>
      <div id="controles-proporcion" style="display:contents"></div>
      <label class="interruptor">
        <input type="checkbox" id="ver-ruedas" checked>
        Mostrar medidas en ruedas
      </label>
      <button type="button" class="compilar" id="compilar">Compilar</button>
      <button type="button" class="volver" id="volver">Volver a la tipología</button>
    </aside>
  </div>
</main>

<!-- Three.js: librería que muestra objetos 3D en el navegador -->

// Punto de partida de cada tipología. Las proporciones son medianas de la
// base de 40 autos. "ancho" es la mediana en mm, sin espejos.
// ejes, voladizos y alto están en ruedas.
const TIPOLOGIAS = {
  sedan: { nombre: 'Sedán', llanta: 17, neumatico: 215, perfil: 55, despeje: 148,
           ejes: 4.24, volDel: 1.38, volTras: 1.6, alto: 2.16, ancho: 1845,
           idea: 'Tres volúmenes: capó, cabina y maletero. Tiene el voladizo trasero más largo de las cuatro tipologías.' },
  hatch: { nombre: 'Hatchback', llanta: 16, neumatico: 195, perfil: 55, despeje: 136,
           ejes: 4.14, volDel: 1.36, volTras: 1.14, alto: 2.33, ancho: 1782,
           idea: 'Dos volúmenes: el techo se prolonga casi hasta el final y la cola se corta de forma vertical.' },
  suv:   { nombre: 'SUV', llanta: 18, neumatico: 225, perfil: 60, despeje: 192,
           ejes: 3.73, volDel: 1.31, volTras: 1.28, alto: 2.31, ancho: 1860,
           idea: 'Postura alta: mucha altura libre al suelo y menos ruedas entre ejes, porque la rueda mide más.' },
  sport: { nombre: 'Deportivo', llanta: 19, neumatico: 255, perfil: 35, despeje: 120,
           ejes: 3.9, volDel: 1.25, volTras: 1.3, alto: 1.96, ancho: 1842,
           idea: 'Capó largo, cabina baja y retrasada, techo que cae en una sola línea hasta la cola.' }
};

// Sliders de la rueda: se mueven en pulgadas, mm y %.
const CONTROLES_RUEDA = [
  { clave: 'llanta', nombre: 'Diámetro de llanta', min: 14, max: 22, paso: 1, unidad: ' pulgadas' },
  { clave: 'neumatico', nombre: 'Ancho del neumático', min: 155, max: 335, paso: 5, unidad: ' mm' },
  { clave: 'perfil', nombre: 'Perfil del neumático', min: 25, max: 80, paso: 5, unidad: ' %' }
];

// Sliders del auto: guardan mm y se leen en ruedas.
const CONTROLES_PROPORCION = [
  { clave: 'ejes', nombre: 'Distancia entre ejes', min: 2200, max: 3400 },
  { clave: 'volDel', nombre: 'Voladizo delantero', min: 600, max: 1300 },
  { clave: 'volTras', nombre: 'Voladizo trasero', min: 500, max: 1400 },
  { clave: 'alto', nombre: 'Altura total', min: 1100, max: 2000 },
  { clave: 'ancho', nombre: 'Ancho total', min: 1600, max: 2200 }
];

// 2) ESTADO: los valores actuales del auto ----------------------

let tipo = 'sedan';
let auto = {};

// Diámetro exterior de la rueda en mm. Ej.: 215/55 R17
const diametro = (a) => a.llanta * 25.4 + 2 * a.neumatico * a.perfil / 100;

// Carga una tipología: pasa sus proporciones de ruedas a milímetros.
function cargarTipologia(clave) {
  tipo = clave;
  const t = TIPOLOGIAS[clave];
  const D = diametro(t);
  auto = {
    llanta: t.llanta, neumatico: t.neumatico, perfil: t.perfil, despeje: t.despeje,
    ejes: t.ejes * D, volDel: t.volDel * D, volTras: t.volTras * D, alto: t.alto * D,
    ancho: t.ancho
  };
}

// 3) FORMATO: escribir números en español ------------------------

const dos = (n) => n.toFixed(2).replace('.', ',');
const mm = (n) => Math.round(n).toLocaleString('es-CL') + ' mm';

// 4) DIBUJO DEL PERFIL -------------------------------------------

const ESCALA = 0.125;      // 1 mm del auto = 0,125 unidades del dibujo
const SUELO = 330;         // altura de la línea de suelo en el dibujo
const INICIO = 44;         // donde parte la punta delantera del auto

const X = (v) => INICIO + v * ESCALA;
const Y = (v) => SUELO - v * ESCALA;
const fijo = (n) => n.toFixed(1);

// Convierte la posición u de la silueta en milímetros a lo largo del auto.
// De 0 a 1 es el voladizo delantero, de 1 a 2 entre ejes, de 2 a 3 el trasero.
function posicion(u, ejeDel, ejeTras, largo) {
  if (u <= 1) return u * ejeDel;
  if (u <= 2) return ejeDel + (u - 1) * (ejeTras - ejeDel);
  return ejeTras + (u - 2) * (largo - ejeTras);
}

// Une puntos con una curva suave (curva de Bézier).
function curva(puntos) {
  const p = (q) => fijo(q[0]) + ' ' + fijo(q[1]);
  let d = 'M' + p(puntos[0]);
  for (let i = 0; i < puntos.length - 1; i++) {
    const a = puntos[Math.max(0, i - 1)], b = puntos[i], c = puntos[i + 1];
    const e = puntos[Math.min(puntos.length - 1, i + 2)];
    d += ' C' + p([b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6]) + ' ' +
      p([c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6]) + ' ' + p(c);
  }
  return d;
}

function rueda(cx, D, a) {
  const cy = Y(D / 2);
  return `<circle class="goma" cx="${fijo(cx)}" cy="${fijo(cy)}" r="${fijo(D / 2 * ESCALA)}"></circle>` +
    `<circle class="llanta" cx="${fijo(cx)}" cy="${fijo(cy)}" r="${fijo(a.llanta * 25.4 / 2 * ESCALA)}"></circle>`;
}

function cota(x1, x2, y, valor, nombre) {
  const m = (x1 + x2) / 2;
  return `<path class="cota" d="M${fijo(x1)} ${y - 6}V${y + 6}M${fijo(x2)} ${y - 6}V${y + 6}M${fijo(x1)} ${y}H${fijo(x2)}"></path>` +
    `<text class="valor" x="${fijo(m)}" y="${y + 24}">${valor}</text>` +
    `<text class="rotulo" x="${fijo(m)}" y="${y + 42}">${nombre}</text>`;
}

// Alturas de la silueta, de 0 a 1, ajustadas para que el techo llegue a 1.
function alturasSilueta() {
  const v = SILUETAS.tipos[tipo].v;
  const techo = Math.max.apply(null, v);
  return v.map((n) => Math.max(0.05, n / techo));
}

function dibujarPerfil(verRuedas) {
  const a = auto, D = diametro(a);
  const ejeDel = a.volDel, ejeTras = a.volDel + a.ejes, largo = ejeTras + a.volTras, H = a.alto;
  const s = SILUETAS.tipos[tipo];
  const alturas = alturasSilueta();

  // Contorno superior
  let d = curva(SILUETAS.u.map((u, i) => [X(posicion(u, ejeDel, ejeTras, largo)), Y(alturas[i] * H)]));

  // Contorno inferior, con los espacios para las ruedas
  const g = a.despeje, R = 0.56 * D;
  const dy = Math.min(R * 0.98, Math.abs(D / 2 - g));
  const dx = Math.sqrt(R * R - dy * dy);
  const r = fijo(R * ESCALA);
  const p = (x, y) => fijo(X(x)) + ' ' + fijo(Y(y));
  const bajoDel = Math.max(g + 0.04 * D, Math.min(s.b[1], alturas[0] * 0.85) * H);
  const bajoTras = Math.max(g + 0.04 * D, Math.min(s.b[s.b.length - 2], alturas[alturas.length - 1] * 0.85) * H);
  d += ' L' + p(largo - 0.03 * D, bajoTras);
  d += ' L' + p(Math.min(largo - 0.08 * D, ejeTras + dx + 0.05 * D), g);
  d += ' L' + p(ejeTras + dx, g);
  d += ` A${r} ${r} 0 1 0 ` + p(ejeTras - dx, g);
  d += ' L' + p(ejeDel + dx, g);
  d += ` A${r} ${r} 0 1 0 ` + p(ejeDel - dx, g);
  d += ' L' + p(Math.max(0.08 * D, ejeDel - dx - 0.05 * D), g);
  d += ' L' + p(0.03 * D, bajoDel);
  d += ' Z';

  let h = `<line class="suelo" x1="0" x2="840" y1="${SUELO}" y2="${SUELO}"></line>`;
  h += `<path class="cuerpo" d="${d}"></path>`;
  h += rueda(X(ejeDel), D, a) + rueda(X(ejeTras), D, a);

  if (verRuedas) {
    // Ruedas completas que caben entre las dos ruedas del auto
    const caben = Math.floor(a.ejes / D - 1 + 1e-6);
    for (let k = 0; k < caben; k++) {
      h += `<circle class="guia" cx="${fijo(X(ejeDel + D * (k + 1)))}" cy="${fijo(Y(D / 2))}" r="${fijo(D / 2 * ESCALA)}"></circle>`;
    }
    h += `<text class="ruedas-texto" x="${fijo(X((ejeDel + ejeTras) / 2))}" y="${fijo(Y(D) - 10)}">${dos(a.ejes / D - 1)} ruedas entre ruedas</text>`;
    h += cota(X(0), X(ejeDel), SUELO + 14, dos(a.volDel / D), 'voladizo del.');
    h += cota(X(ejeDel), X(ejeTras), SUELO + 14, dos(a.ejes / D), 'entre ejes');
    h += cota(X(ejeTras), X(largo), SUELO + 14, dos(a.volTras / D), 'voladizo tras.');
  }
  document.getElementById('dibujo-perfil').innerHTML = h;
}

// 5) DIBUJO DEL FRENTE --------------------------------------------
// Sección provisional. La misma regla dibuja el frente y arma el modelo 3D.

const LINEA_HOMBROS = 0.5;   // altura de los hombros, como fracción de la carrocería
const ANGOSTA_TECHO = 0.26;  // cuánto se angosta la cabina al llegar al techo

// Recorre media sección del auto: desde el costado hasta el centro del techo.
// h: medio ancho. base: donde parte el costado. sup: altura superior.
function contornoSeccion(h, base, sup, hombros, altoMaximo) {
  const tope = Math.max(sup, base + 30);
  const zona = Math.max(base, Math.min(hombros, tope - 30));
  const a = tope - zona;
  const avance = Math.min(1, a / Math.max(1, altoMaximo - hombros));
  const t = 1 - ANGOSTA_TECHO * avance;       // ancho del techo respecto del costado
  const puntos = [];

  for (let i = 0; i < 3; i++) puntos.push([h, base + (zona - base) * i / 3]);

  // Del hombro al techo: una curva de Bézier cúbica
  const p0 = [h, zona], c1 = [h, zona + a * 0.3];
  const c2 = [Math.min(h, h * t * 1.04), tope - a * 0.45], p3 = [h * t, tope - a * 0.1];
  for (let i = 0; i < 10; i++) {
    const u = i / 10, w = 1 - u;
    puntos.push([0, 1].map((k) => w * w * w * p0[k] + 3 * w * w * u * c1[k] + 3 * w * u * u * c2[k] + u * u * u * p3[k]));
  }
  // Esquina redondeada del techo
  const c = [h * t * 0.97, tope], p4 = [h * t * 0.78, tope];
  for (let i = 0; i < 6; i++) {
    const u = i / 6, w = 1 - u;
    puntos.push([0, 1].map((k) => w * w * p3[k] + 2 * w * u * c[k] + u * u * p4[k]));
  }
  // Tramo plano hasta el centro
  for (let i = 0; i < 6; i++) puntos.push([p4[0] * (1 - i / 5), tope]);
  return puntos;
}

function dibujarFrente(verRuedas) {
  const a = auto, D = diametro(a);
  const cx = 168, w = a.ancho / 2, H = a.alto, g = a.despeje;
  const px = (v) => fijo(cx + v * ESCALA);
  const hombros = g + (H - g) * LINEA_HOMBROS;

  const media = contornoSeccion(w, g + 90, H, hombros, H);
  const subir = media.map((q) => `L${px(q[0])} ${fijo(Y(q[1]))}`).join(' ');
  const bajar = media.slice().reverse().map((q) => `L${px(-q[0])} ${fijo(Y(q[1]))}`).join(' ');
  const d = `M${px(-w * 0.9)} ${fijo(Y(g))} L${px(w * 0.9)} ${fijo(Y(g))} ` +
    `Q${px(w)} ${fijo(Y(g))} ${px(w)} ${fijo(Y(g + 90))} ${subir} ${bajar} ` +
    `Q${px(-w)} ${fijo(Y(g))} ${px(-w * 0.9)} ${fijo(Y(g))} Z`;

  const ta = a.neumatico * ESCALA, alto = D * ESCALA;
  const borde = Math.min(w - a.neumatico / 2 - 10, w);
  const goma = (s) => `<rect class="goma" x="${fijo(cx + s * borde * ESCALA - ta / 2)}" y="${fijo(Y(D))}" width="${fijo(ta)}" height="${fijo(alto)}" rx="4"></rect>`;

  let h = `<line class="suelo" x1="0" x2="360" y1="${SUELO}" y2="${SUELO}"></line>`;
  h += goma(-1) + goma(1) + `<path class="cuerpo" d="${d}"></path>`;

  if (verRuedas) {
    h += cota(cx - w * ESCALA, cx + w * ESCALA, SUELO + 14, dos(a.ancho / D), 'ancho');
    const x = fijo(cx + w * ESCALA + 16), y1 = fijo(Y(0)), y2 = fijo(Y(H));
    h += `<path class="cota" d="M${+x - 6} ${y1}H${+x + 6}M${+x - 6} ${y2}H${+x + 6}M${x} ${y1}V${y2}"></path>`;
    h += `<text class="valor" x="${+x + 2}" y="${fijo(Y(H) - 10)}">${dos(a.alto / D)}</text>`;
  }
  document.getElementById('dibujo-frente').innerHTML = h;
}

// 6) MODELO 3D --------------------------------------------------------
// Un modelo 3D es una lista de vértices (puntos) y caras (triángulos que los unen).
// La carrocería se arma como un loft: secciones repetidas de adelante hacia atrás.
// Ejes: x = largo, y = altura, z = ancho. Todas las medidas están en mm.

function nuevaParte(nombre, material) {
  return { nombre, material, vertices: [], caras: [] };
}

function area(a, b, c) {
  const u = [0, 1, 2].map((k) => b[k] - a[k]), v = [0, 1, 2].map((k) => c[k] - a[k]);
  const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  return Math.hypot(n[0], n[1], n[2]) / 2;
}

function agregarCara(parte, a, b, c) {
  const v = parte.vertices;
  if (area(v[a], v[b], v[c]) > 0.001) parte.caras.push([a, b, c]);
}

// Une una grilla de puntos con caras. filas: secciones; columnas: puntos de cada sección.
function agregarMalla(parte, filas, invertir) {
  const base = parte.vertices.length, n = filas[0].length;
  filas.forEach((fila) => fila.forEach((q) => parte.vertices.push(q)));
  const id = (i, j) => base + i * n + j;
  for (let i = 0; i < filas.length - 1; i++) {
    for (let j = 0; j < n - 1; j++) {
      const a = id(i, j), b = id(i + 1, j), c = id(i + 1, j + 1), d = id(i, j + 1);
      if (invertir) { agregarCara(parte, a, c, b); agregarCara(parte, a, d, c); }
      else { agregarCara(parte, a, b, c); agregarCara(parte, a, c, d); }
    }
  }
}

function interpolar(tabla, x) {
  if (x <= tabla[0][0]) return tabla[0][1];
  for (let i = 1; i < tabla.length; i++) {
    if (x <= tabla[i][0]) {
      const a = tabla[i - 1], b = tabla[i], t = (x - a[0]) / Math.max(1e-6, b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * t;
    }
  }
  return tabla[tabla.length - 1][1];
}

// Tapa el extremo delantero o trasero uniendo su contorno con un punto central.
function agregarTapa(parte, contorno, invertir) {
  const centro = [0, 1, 2].map((k) => contorno.reduce((s, q) => s + q[k], 0) / contorno.length);
  const base = parte.vertices.length;
  parte.vertices.push(centro);
  contorno.forEach((q) => parte.vertices.push(q));
  for (let i = 0; i < contorno.length; i++) {
    const a = base + 1 + i, b = base + 1 + (i + 1) % contorno.length;
    if (invertir) agregarCara(parte, base, b, a); else agregarCara(parte, base, a, b);
  }
}

function crearCarroceria(a) {
  const D = diametro(a), ejeDel = a.volDel, ejeTras = a.volDel + a.ejes, largo = ejeTras + a.volTras;
  const H = a.alto, g = a.despeje, medioAncho = a.ancho / 2;
  const s = SILUETAS.tipos[tipo], alturas = alturasSilueta();
  const hombros = g + (H - g) * LINEA_HOMBROS;

  // Contornos del perfil: los mismos de la vista lateral
  const superior = SILUETAS.u.map((u, i) => [posicion(u, ejeDel, ejeTras, largo), alturas[i] * H]);
  const R = 0.56 * D, cy = D / 2;
  const dy = Math.min(R * 0.98, Math.abs(cy - g)), dx = Math.sqrt(R * R - dy * dy);
  const bajoDel = Math.max(g + 0.04 * D, Math.min(s.b[1], alturas[0] * 0.85) * H);
  const bajoTras = Math.max(g + 0.04 * D, Math.min(s.b[s.b.length - 2], alturas[alturas.length - 1] * 0.85) * H);
  const inferior = [[0, bajoDel], [Math.max(0.08 * D, ejeDel - dx - 0.05 * D), g],
    [Math.min(largo - 0.08 * D, ejeTras + dx + 0.05 * D), g], [largo, bajoTras]];

  // Posiciones de las secciones: más densas alrededor de las ruedas
  const paradas = [];
  for (let i = 0; i <= 120; i++) paradas.push(largo * i / 120);
  [ejeDel, ejeTras].forEach((centro) => {
    for (let i = 0; i <= 40; i++) paradas.push(centro - dx * Math.cos(Math.PI * i / 40));
  });
  const xs = paradas.filter((x) => x >= 0 && x <= largo).sort((m, n) => m - n)
    .filter((x, i, lista) => i === 0 || x - lista[i - 1] > 0.5);

  // El auto se angosta suavemente en los extremos, visto desde arriba
  const zonaDel = Math.min(largo * 0.15, ejeDel * 0.8), zonaTras = Math.min(largo * 0.11, a.volTras * 0.8);
  const planta = (x) => {
    const redondeo = (d) => Math.sqrt(Math.max(0, 1 - (1 - d) * (1 - d)));
    if (x < zonaDel) return 0.62 + 0.38 * redondeo(x / zonaDel);
    if (largo - x < zonaTras) return 0.68 + 0.32 * redondeo((largo - x) / zonaTras);
    return 1;
  };

  // Cubierta de la rueda: el arco que se ve en la vista lateral
  const arco = (x) => [ejeDel, ejeTras].reduce((m, c) =>
    (Math.abs(x - c) < R ? Math.max(m, cy + Math.sqrt(R * R - (x - c) * (x - c))) : m), 0);

  const piso = [], pared = [], cielo = [], costado = [];
  const interiorRueda = medioAncho - 15 - a.neumatico - 40;
  xs.forEach((x) => {
    const h = medioAncho * planta(x), inf = interpolar(inferior, x), sup = interpolar(superior, x);
    const tope = Math.max(sup, inf + 30);
    const interior = Math.max(40, Math.min(interiorRueda, h - 20));
    const techoRueda = Math.max(inf, Math.min(arco(x), tope - 40));
    piso.push([0, 1, 2, 3].map((i) => [x, inf, interior * i / 3]));
    pared.push([[x, inf, interior], [x, techoRueda, interior]]);
    cielo.push([0, 1, 2].map((i) => [x, techoRueda, interior + (h - interior) * i / 2]));
    costado.push(contornoSeccion(h, techoRueda, sup, hombros, H).map((q) => [x, q[1], q[0]]));
  });

  const parte = nuevaParte('carroceria', 'cuerpo');
  const espejo = (filas) => filas.map((f) => f.map((q) => [q[0], q[1], -q[2]]));
  [piso, pared, cielo, costado].forEach((filas) => {
    agregarMalla(parte, filas, false);
    agregarMalla(parte, espejo(filas), true);
  });

  // Tapas delantera y trasera
  const contorno = (i) => {
    const derecha = [].concat(piso[i], pared[i], cielo[i], costado[i]);
    const unica = derecha.filter((q, n) => n === 0 || Math.hypot(q[1] - derecha[n - 1][1], q[2] - derecha[n - 1][2]) > 0.01);
    const izquierda = unica.slice(1, -1).reverse().map((q) => [q[0], q[1], -q[2]]);
    return unica.concat(izquierda);
  };
  agregarTapa(parte, contorno(0), false);
  agregarTapa(parte, contorno(xs.length - 1), true);
  return parte;
}

function crearCilindro(nombre, material, x, y, zCentro, radio, ancho) {
  const parte = nuevaParte(nombre, material), lados = 40;
  const anillo = (z) => {
    const f = [];
    for (let i = 0; i <= lados; i++) {
      const t = 2 * Math.PI * i / lados;
      f.push([x + radio * Math.cos(t), y + radio * Math.sin(t), z]);
    }
    return f;
  };
  agregarMalla(parte, [anillo(zCentro - ancho / 2), anillo(zCentro + ancho / 2)], true);
  agregarTapa(parte, anillo(zCentro + ancho / 2).slice(0, -1), false);
  agregarTapa(parte, anillo(zCentro - ancho / 2).slice(0, -1), true);
  return parte;
}

function crearModelo(a) {
  const D = diametro(a), ejes = [['del', a.volDel], ['tras', a.volDel + a.ejes]];
  const zRueda = a.ancho / 2 - 15 - a.neumatico / 2;
  const partes = [crearCarroceria(a)];
  ejes.forEach(([eje, x]) => {
    [['der', 1], ['izq', -1]].forEach(([lado, signo]) => {
      partes.push(crearCilindro(`neumatico_${eje}_${lado}`, 'goma', x, D / 2, signo * zRueda, D / 2, a.neumatico));
      partes.push(crearCilindro(`llanta_${eje}_${lado}`, 'llanta', x, D / 2, signo * zRueda, a.llanta * 25.4 / 2, a.neumatico + 8));
    });
  });
  return partes;
}

// Convierte el modelo al formato OBJ, un archivo de texto que abren Blender y Rhino.
// Las líneas v guardan vértices y las líneas f guardan caras.
function aOBJ(partes, nombreAuto) {
  const lineas = ['# Estudio de proporciones', `# Auto: ${nombreAuto}`, '# Unidades: milimetros', ''];
  let total = 0;
  partes.forEach((parte) => {
    const indice = new Map(), mapa = [];
    lineas.push(`o ${parte.nombre}`);
    parte.vertices.forEach((q, i) => {
      const clave = q.map((n) => n.toFixed(1)).join(' ');
      if (!indice.has(clave)) {
        indice.set(clave, ++total);
        lineas.push('v ' + clave);
      }
      mapa[i] = indice.get(clave);
    });
    parte.caras.forEach((c) => lineas.push(`f ${mapa[c[0]]} ${mapa[c[1]]} ${mapa[c[2]]}`));
    lineas.push('');
  });
  return lineas.join('\n');
}

// 7) VISOR 3D: muestra el modelo en pantalla con Three.js ---------------

const visor = { escena: null, camara: null, render: null, controles: null, grupo: null, suelo: null };

function colorCSS(nombre) {
  return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(nombre).trim());
}

function dibujarVisor() {
  if (!visor.render) return;
  visor.suelo.visible = visor.camara.position.y >= 0;   // bajo el auto, el suelo se oculta
  girarCubo();
  visor.render.render(visor.escena, visor.camara);
}

function ajustarVisor() {
  if (!visor.render) return;
  const caja = porId('visor-3d');
  visor.render.setSize(caja.clientWidth, caja.clientHeight, false);
  // Encuadre: la cámara paralela muestra un rectángulo de medidas fijas
  const aspecto = caja.clientWidth / Math.max(1, caja.clientHeight);
  const medio = Math.max(visor.tamano * 0.42, visor.tamano * 0.72 / aspecto);
  visor.camara.left = -medio * aspecto;
  visor.camara.right = medio * aspecto;
  visor.camara.top = medio;
  visor.camara.bottom = -medio;
  visor.camara.updateProjectionMatrix();
  dibujarVisor();
}

function iniciarVisor() {
  const caja = porId('visor-3d');
  visor.render = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  visor.render.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  caja.appendChild(visor.render.domElement);

  visor.escena = new THREE.Scene();
  // Cámara paralela: sin perspectiva, como la vista isométrica de Inventor o AutoCAD
  visor.camara = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  visor.escena.add(new THREE.HemisphereLight(0xffffff, 0x77807f, 0.62));
  const sol = new THREE.DirectionalLight(0xffffff, 0.42);
  sol.position.set(-3, 5, 4);
  visor.escena.add(sol);

  visor.controles = new THREE.OrbitControls(visor.camara, visor.render.domElement);
  visor.controles.enableDamping = false;
  visor.controles.addEventListener('change', dibujarVisor);

  new ResizeObserver(ajustarVisor).observe(caja);
}

function mostrarModelo(partes, a) {
  if (!visor.render) iniciarVisor();
  visor.escena.background = colorCSS('--plano');

  const limpiar = (objeto) => {
    if (!objeto) return;
    visor.escena.remove(objeto);
    objeto.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  };
  limpiar(visor.grupo);
  limpiar(visor.suelo);

  const colores = {
    cuerpo: colorCSS('--carroceria'), goma: new THREE.Color(0x23292b), llanta: colorCSS('--llanta')
  };
  const largo = a.volDel + a.ejes + a.volTras, D = diametro(a), metro = 0.001;

  visor.grupo = new THREE.Group();
  partes.forEach((parte) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(parte.vertices.flat(), 3));
    g.setIndex(parte.caras.flat());
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({ color: colores[parte.material], roughness: 0.55, metalness: 0.05 });
    visor.grupo.add(new THREE.Mesh(g, m));
  });
  visor.grupo.scale.setScalar(metro);
  visor.grupo.position.x = -largo / 2 * metro;
  visor.escena.add(visor.grupo);

  // Cada cuadro del suelo mide una rueda
  const cuadros = Math.ceil(10000 / D);
  visor.suelo = new THREE.GridHelper(cuadros * D * metro, cuadros, colorCSS('--tinta-suave'), colorCSS('--linea'));
  visor.escena.add(visor.suelo);

  const c = largo * metro;
  visor.tamano = c;
  visor.camara.zoom = 1;
  visor.controles.target.set(0, a.alto * 0.45 * metro, 0);
  visor.inicio = new THREE.Vector3(-c * 1.2, c * 0.5, c * 1.5);
  visor.camara.position.copy(visor.inicio);
  visor.controles.update();
  ajustarVisor();
}

// 8) CUBO DE VISTAS ----------------------------------------------------
// Cada cara se divide en 9 zonas: centro = vista de cara, borde y esquina = vista
// intermedia. La dirección es desde dónde mira la cámara, respecto del centro del auto.
// En este modelo, la nariz del auto apunta hacia -x.

const CARAS = [
  { nombre: 'FRENTE', normal: [-1, 0, 0], derecha: [0, 0, 1], arriba: [0, 1, 0], css: 'rotateY(-90deg)' },
  { nombre: 'ATRÁS', normal: [1, 0, 0], derecha: [0, 0, -1], arriba: [0, 1, 0], css: 'rotateY(90deg)' },
  { nombre: 'IZQ', normal: [0, 0, 1], derecha: [1, 0, 0], arriba: [0, 1, 0], css: '' },
  { nombre: 'DER', normal: [0, 0, -1], derecha: [-1, 0, 0], arriba: [0, 1, 0], css: 'rotateY(180deg)' },
  { nombre: 'ARRIBA', normal: [0, 1, 0], derecha: [1, 0, 0], arriba: [0, 0, -1], css: 'rotateX(90deg)' },
  { nombre: 'ABAJO', normal: [0, -1, 0], derecha: [1, 0, 0], arriba: [0, 0, 1], css: 'rotateX(-90deg)' }
];

function crearCubo() {
  const cubo = porId('cubo');
  CARAS.forEach((cara) => {
    const placa = document.createElement('div');
    placa.className = 'cara';
    placa.style.transform = `${cara.css} translateZ(48px)`;
    for (let fila = 1; fila >= -1; fila--) {
      for (let col = -1; col <= 1; col++) {
        const direccion = [0, 1, 2].map((k) => cara.normal[k] + col * cara.derecha[k] + fila * cara.arriba[k]);
        const b = document.createElement('button');
        b.type = 'button';
        const centro = col === 0 && fila === 0;
        b.tabIndex = centro ? 0 : -1;
        const esquina = col !== 0 && fila !== 0;
        b.setAttribute('aria-label', centro ? `Vista ${cara.nombre.toLowerCase()}` : esquina ? 'Vista isométrica' : 'Vista intermedia');
        b.dataset.direccion = direccion.join(',');
        b.addEventListener('click', () => irAVista(direccion));
        // Al pasar el mouse se ilumina la zona completa: una esquina toca 3 caras y un borde 2
        const marcar = (activa) => document.querySelectorAll(`.cara button[data-direccion="${b.dataset.direccion}"]`)
          .forEach((zona) => zona.classList.toggle('activa', activa));
        b.addEventListener('pointerenter', () => marcar(true));
        b.addEventListener('pointerleave', () => marcar(false));
        b.addEventListener('focus', () => marcar(true));
        b.addEventListener('blur', () => marcar(false));
        placa.appendChild(b);
      }
    }
    const nombre = document.createElement('span');
    nombre.className = 'cara-nombre';
    nombre.textContent = cara.nombre;
    placa.appendChild(nombre);
    cubo.appendChild(placa);
  });
  porId('vista-inicio').addEventListener('click', () => irAVista(visor.inicio.toArray()));
}

// Copia la rotación de la cámara en el cubo. CSS mide y hacia abajo y 3D hacia arriba.
function girarCubo() {
  const e = visor.camara.matrixWorldInverse.elements;
  const s = [1, -1, 1, 1];
  const m = [];
  for (let col = 0; col < 3; col++) {
    for (let fila = 0; fila < 3; fila++) m.push(e[col * 4 + fila] * s[col] * s[fila]);
    m.push(0);
  }
  m.push(0, 0, 0, 1);
  porId('cubo').style.transform = `matrix3d(${m.map((n) => n.toFixed(5)).join(',')})`;
}

// Lleva la cámara a una dirección con una transición corta.
function irAVista(direccion) {
  const objetivo = visor.controles.target;
  const inicio = new THREE.Spherical().setFromVector3(visor.camara.position.clone().sub(objetivo));
  const destino = new THREE.Spherical().setFromVector3(new THREE.Vector3().fromArray(direccion));
  destino.radius = inicio.radius;
  destino.makeSafe();
  if (Math.abs(direccion[0]) < 1e-6 && Math.abs(direccion[2]) < 1e-6) destino.theta = 0;  // vista recta desde arriba o abajo

  let giro = destino.theta - inicio.theta;
  if (giro > Math.PI) giro -= 2 * Math.PI;
  if (giro < -Math.PI) giro += 2 * Math.PI;

  const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duracion = quieto ? 0 : 350, comienzo = performance.now();
  const paso = (ahora) => {
    const t = duracion ? Math.min(1, (ahora - comienzo) / duracion) : 1;
    const suave = t * t * (3 - 2 * t);
    const lugar = new THREE.Spherical(inicio.radius, inicio.phi + (destino.phi - inicio.phi) * suave, inicio.theta + giro * suave);
    visor.camara.position.setFromSpherical(lugar).add(objetivo);
    visor.controles.update();
    if (t < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

// 9) COMPILAR: reúne las vistas y el modelo del auto actual -------------

let compilado = null;

const huellaAuto = () => JSON.stringify([tipo, auto]);

function compilar() {
  const partes = crearModelo(auto);
  compilado = {
    huella: huellaAuto(),
    obj: aOBJ(partes, TIPOLOGIAS[tipo].nombre),
    archivo: `${TIPOLOGIAS[tipo].nombre.toLowerCase().replace('á', 'a').replace('é', 'e')}-compilado.obj`
  };
  porId('vista-lateral').innerHTML = porId('dibujo-perfil').innerHTML;
  porId('vista-frontal').innerHTML = porId('dibujo-frente').innerHTML;
  porId('resultado').hidden = false;

  try {
    mostrarModelo(partes, auto);
  } catch (error) {
    porId('visor-3d').innerHTML = '<p class="sin-3d">Este navegador no pudo mostrar el modelo 3D. Prueba con Chrome o Edge actualizado. El OBJ se puede descargar igual.</p>';
  }
  actualizarEstado();
  porId('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function actualizarEstado() {
  if (!compilado) return;
  const vigente = compilado.huella === huellaAuto();
  const estado = porId('estado-compilado');
  estado.textContent = vigente
    ? 'El resultado coincide con los controles actuales.'
    : 'Cambiaste los controles. Presiona Compilar para actualizar el resultado.';
  estado.classList.toggle('aviso', !vigente);
}

// Crea un archivo en la memoria del navegador y lo descarga.
function descargarOBJ() {
  if (!compilado) return;
  const enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(new Blob([compilado.obj], { type: 'text/plain' }));
  enlace.download = compilado.archivo;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(enlace.href), 1000);
}

// 10) INTERFAZ: construir y actualizar lo que se ve -------------------

const porId = (id) => document.getElementById(id);

function crearControl(c, contenedor) {
  const caja = document.createElement('div');
  caja.className = 'control';
  caja.innerHTML = `<div class="fila"><label for="s-${c.clave}">${c.nombre}</label><output id="v-${c.clave}" for="s-${c.clave}"></output></div>` +
    `<input type="range" id="s-${c.clave}" min="${c.min}" max="${c.max}" step="${c.paso || 5}">` +
    (c.paso ? '' : `<small id="m-${c.clave}"></small>`);
  contenedor.appendChild(caja);
  // "input" ocurre cada vez que el estudiante mueve el slider
  porId('s-' + c.clave).addEventListener('input', (e) => {
    auto[c.clave] = Number(e.target.value);
    actualizar();
  });
}

function crearInterfaz() {
  CONTROLES_RUEDA.forEach((c) => crearControl(c, porId('controles-rueda')));
  CONTROLES_PROPORCION.forEach((c) => crearControl(c, porId('controles-proporcion')));

  Object.keys(TIPOLOGIAS).forEach((clave) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.tipo = clave;
    b.textContent = TIPOLOGIAS[clave].nombre;
    b.addEventListener('click', () => { cargarTipologia(clave); actualizar(); });
    porId('tipologias').appendChild(b);
  });

  porId('ver-ruedas').addEventListener('change', actualizar);
  porId('volver').addEventListener('click', () => { cargarTipologia(tipo); actualizar(); });
  porId('compilar').addEventListener('click', compilar);
  crearCubo();
  porId('descargar-obj').addEventListener('click', descargarOBJ);
}

function actualizar() {
  const a = auto, D = diametro(a), largo = a.volDel + a.ejes + a.volTras;

  CONTROLES_RUEDA.forEach((c) => {
    porId('s-' + c.clave).value = a[c.clave];
    porId('v-' + c.clave).textContent = a[c.clave] + c.unidad;
  });
  CONTROLES_PROPORCION.forEach((c) => {
    porId('s-' + c.clave).value = a[c.clave];
    porId('v-' + c.clave).textContent = dos(a[c.clave] / D) + ' ruedas';
    porId('m-' + c.clave).textContent = mm(a[c.clave]);
  });

  document.querySelectorAll('.tipologias button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.tipo === tipo));
  });

  const datos = [
    ['Rueda', mm(D), `${a.neumatico}/${a.perfil} R${a.llanta}`],
    ['Largo total', dos(largo / D) + ' ruedas', mm(largo)],
    ['Alto ÷ ancho', dos(a.alto / a.ancho), 'relación de frente'],
    ['Largo ÷ alto', dos(largo / a.alto), 'relación de perfil']
  ];
  porId('medidas').innerHTML = datos.map((f) =>
    `<div class="medida"><span>${f[0]}</span><strong>${f[1]}</strong><span>${f[2]}</span></div>`).join('');

  porId('nota').innerHTML = `<b>${TIPOLOGIAS[tipo].nombre}.</b> ${TIPOLOGIAS[tipo].idea} ` +
    'La forma del frente es provisional.';

  const ver = porId('ver-ruedas').checked;
  dibujarPerfil(ver);
  dibujarFrente(ver);
  actualizarEstado();
}

// 11) INICIO ---------------------------------------------------------
crearInterfaz();
cargarTipologia('sedan');
actualizar();
